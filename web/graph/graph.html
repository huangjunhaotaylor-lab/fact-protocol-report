<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Graph OS · BSP Reality Layer</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="./graph.css">
</head>
<body>
<div class="graph-workspace bgo" id="ws">

  <!-- ============ 顶栏 ============ -->
  <header class="bgo-top">
    <div class="bgo-brand">
      <span class="bgo-logo">◆</span>
      <span class="bgo-name">Business Graph OS</span>
      <small class="bgo-sub">BSP Reality Layer</small>
    </div>

    <div class="bgo-search" role="search">
      <span class="bgo-search-ico">🔍</span>
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
        placeholder="试试：Object 类型 Customer / Signal 状态 Captured / 任意关键词"
        aria-label="图搜索">
    </div>

    <div class="seg" id="modeSeg" role="tablist" aria-label="模式切换">
      <button data-mode="explore" class="on" role="tab">探索</button>
      <button data-mode="judge" role="tab">研判</button>
    </div>

    <div class="bgo-scenebox">
      <button class="btn small" id="sceneBtn" aria-haspopup="true">场景 ▾</button>
      <div class="bgo-dropdown" id="sceneMenu" hidden></div>
    </div>

    <a class="bgo-admin" href="/static/index.html">管理视图 →</a>
  </header>

  <!-- ============ 追溯横幅 ============ -->
  <div class="bgo-tracebar" id="traceBar" hidden>
    <span class="tb-dot"></span>
    <span>追溯模式：<b id="traceLabel"></b></span>
    <span class="tb-hint">Esc 退出</span>
    <button class="btn small" id="traceExit">退出 ×</button>
  </div>

  <!-- ============ 主区 ============ -->
  <main class="bgo-main">

    <!-- 左：过滤器（仅研判） -->
    <aside class="bgo-filters" id="filterPanel" hidden>
      <div class="bf-head">
        <h3>过滤器</h3>
        <button class="bf-collapse" id="filterCollapse" title="收起面板">«</button>
      </div>

      <section class="bf-group">
        <div class="bf-title">节点类型</div>
        <label class="bf-check" data-kind="Evidence"><input type="checkbox" checked><span class="dot k-Evidence"></span>Evidence<span class="bf-count" data-count="Evidence">0</span></label>
        <label class="bf-check" data-kind="Fragment"><input type="checkbox" checked><span class="dot k-Fragment"></span>Fragment<span class="bf-count" data-count="Fragment">0</span></label>
        <label class="bf-check" data-kind="Signal"><input type="checkbox" checked><span class="dot k-Signal"></span>Signal<span class="bf-count" data-count="Signal">0</span></label>
        <label class="bf-check" data-kind="Object"><input type="checkbox" checked><span class="dot k-Object"></span>Object<span class="bf-count" data-count="Object">0</span></label>
        <label class="bf-check" data-kind="Relation"><input type="checkbox" checked><span class="dot k-Relation"></span>Relation<span class="bf-count" data-count="Relation">0</span></label>
      </section>

      <section class="bf-group">
        <div class="bf-title">Signal 状态</div>
        <div class="bf-chips" id="sigStateChips">
          <button class="chip on" data-state="Captured">Captured</button>
          <button class="chip on" data-state="Verified">Verified</button>
          <button class="chip on" data-state="Invalid">Invalid</button>
          <button class="chip on" data-state="Archived">Archived</button>
        </div>
      </section>

      <section class="bf-group">
        <div class="bf-title">Object 类型</div>
        <select id="objTypeSel" class="bf-select">
          <option value="">全部类型</option>
        </select>
      </section>

      <section class="bf-group">
        <div class="bf-title">节点尺寸</div>
        <div class="seg bf-seg" id="sizingSeg">
          <button data-mode="fixed" class="on">固定</button>
          <button data-mode="confidence">置信度</button>
          <button data-mode="degree">连接度</button>
        </div>
      </section>

      <section class="bf-group">
        <label class="bf-switch">
          <input type="checkbox" id="dimIsolated">
          <span>淡出孤立节点</span>
        </label>
      </section>
    </aside>

    <!-- 中：画布 -->
    <div class="graph-canvas-wrap" id="wrap">
      <canvas id="graph" class="graph-canvas"></canvas>

      <!-- 图例（左下悬浮卡） -->
      <div class="bgo-legend graph-panel" id="legend">
        <div class="gp-title">图例</div>
        <div class="lg-row"><span class="lg-shape lg-evidence"></span>Evidence 证据</div>
        <div class="lg-row"><span class="lg-shape lg-fragment"></span>Fragment 片段</div>
        <div class="lg-row"><span class="lg-shape lg-signal"></span>Signal 信号</div>
        <div class="lg-row"><span class="lg-shape lg-object"></span>Object 对象</div>
        <div class="lg-row"><span class="lg-shape lg-relation"></span>Relation 关系</div>
        <div class="lg-sep"></div>
        <div class="lg-row"><span class="lg-edge solid"></span>支撑 / 锚定</div>
        <div class="lg-row"><span class="lg-edge dashed"></span>出处 / 同链</div>
        <div class="lg-row"><span class="lg-edge dotted"></span>合并</div>
      </div>

      <!-- 空态引导卡 -->
      <div class="bgo-empty" id="emptyState" hidden>
        <div class="be-card">
          <div class="be-logo">◆</div>
          <div class="be-title">从搜索开始你的探索</div>
          <div class="be-hint">搜索命中节点落入画布，双击逐层展开它的世界</div>
          <div class="be-examples" id="emptyExamples">
            <button class="be-chip" data-q="Signal 状态 Captured">Signal 状态 Captured</button>
            <button class="be-chip" data-q="Object 类型 Customer">Object 类型 Customer</button>
            <button class="be-chip" data-q="Evidence 来源 meeting">Evidence 来源 meeting</button>
          </div>
        </div>
      </div>

      <!-- 加载骨架 -->
      <div class="bgo-loading" id="loading" hidden>
        <div class="bl-pulse"></div>
        <div class="bl-text">正在构建图…</div>
      </div>

      <div class="graph-tip" id="tip" hidden></div>
      <div class="graph-menu" id="menu" hidden></div>

      <button class="bgo-reopen left" id="reopenFilters" hidden>过滤器 ›</button>
      <button class="bgo-reopen right" id="reopenInspector" hidden>‹ 检查器</button>
    </div>

    <!-- 右：检查器 -->
    <aside class="bgo-inspector" id="inspectorPanel">
      <div class="bi-head">
        <h3 id="inspectorTitle">检查器</h3>
        <button class="bf-collapse" id="inspectorCollapse" title="收起面板">»</button>
      </div>
      <div class="bi-body" id="inspectorBody">
        <div class="bi-placeholder">点击画布中的节点查看详情<br><small>右键节点打开操作菜单 · 双击展开邻居</small></div>
      </div>
    </aside>
  </main>

  <!-- ============ 底：时间直方图（仅研判） ============ -->
  <footer class="graph-timebar bgo-timebar" id="timebar" hidden>
    <div class="gt-head">
      <span>⏱ 时间直方图滑杆</span>
      <span class="gt-window-label" id="twLabel">全时段</span>
      <button class="btn small" id="twReset">重置</button>
    </div>
    <div class="gt-track" id="gtTrack">
      <div class="gt-bars" id="gtBars"></div>
      <div class="gt-window" id="twWindow"></div>
      <input type="range" id="twMin" min="0" max="1000" step="1" value="0" aria-label="时间窗起点">
      <input type="range" id="twMax" min="0" max="1000" step="1" value="1000" aria-label="时间窗终点">
    </div>
    <div class="gt-scale"><span id="t0Label"></span><span id="t1Label"></span></div>
  </footer>
</div>

<div class="bgo-toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script type="module" src="./app.js"></script>
</body>
</html>
