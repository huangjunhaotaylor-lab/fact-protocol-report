<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSP Reality Layer — Signal 工作台</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* ===== Signal 工作台自有样式（不动 styles.css） ===== */

    /* 工具条 */
    .tb-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .tb-row label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .tb-row select, .tb-row input {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--card-bg);
      padding: 5px 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--ink);
    }
    .tb-row select:focus, .tb-row input:focus { outline: none; border-color: var(--c-signal); }
    .tb-row input { flex: 1 1 200px; min-width: 160px; }
    .tb-count { margin-left: auto; font-size: 12px; color: var(--muted); }

    /* 四列看板 */
    .board-wrap { overflow-x: auto; padding-bottom: 8px; }
    .board { display: flex; gap: 16px; align-items: flex-start; min-width: 980px; }
    .board-col {
      flex: 1 1 0;
      min-width: 0;
      border: 1px solid var(--line);
      border-top-width: 3px;
      border-radius: var(--radius);
      background: var(--bg);
      padding: 10px;
    }
    .board-col.col-Captured { border-top-color: var(--st-captured); }
    .board-col.col-Verified { border-top-color: var(--st-verified); }
    .board-col.col-Invalid  { border-top-color: var(--st-invalid); }
    .board-col.col-Archived { border-top-color: var(--st-archived); }
    .col-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .col-head .col-name { font-size: 13px; font-weight: 700; }
    .col-head .col-name small { font-weight: 400; color: var(--muted); margin-left: 4px; }
    .col-head .col-count { font-size: 13px; color: var(--muted); }
    .col-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 14px 4px; }

    /* Signal 卡片 */
    .sig-card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .sig-card:last-child { margin-bottom: 0; }
    .sig-card.hl { border-color: var(--c-signal); border-left-width: 3px; }
    .sc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .sc-id { font-size: 12px; font-weight: 600; }
    .sc-body {
      font-size: 13px;
      margin-top: 5px;
      overflow-wrap: anywhere;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .sc-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 6px; font-size: 11px; color: var(--muted);
    }
    .sc-anchors { margin-top: 6px; font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .sc-ctx { margin-top: 6px; font-size: 11px; color: var(--muted); line-height: 1.7; }
    .sc-ctx .ck { color: var(--muted); }
    .sc-ctx .cv { color: var(--ink); overflow-wrap: anywhere; }

    /* 类型徽标：五色低饱和（不动 styles.css，类名 sig-*） */
    .badge.sig-observation { color: var(--c-signal);   border-color: #a0aab8;           background: #eef1f5; }
    .badge.sig-event       { color: #475569;           border-color: #94a3b8;           background: #f1f5f9; }
    .badge.sig-change      { color: #3e5f55;           border-color: #93aca2;           background: #edf3f0; }
    .badge.sig-status      { color: var(--c-timeline); border-color: #9fabbb;           background: #eef1f5; }
    .badge.sig-action      { color: #67717f;           border-color: #b4bcc6;           background: #f3f5f7; }

    /* 操作区：状态机即 UI */
    .sc-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .sc-actions .btn-verify  { border-color: var(--st-verified); color: var(--st-verified); }
    .sc-actions .btn-verify:hover { background: #eef6f1; }
    .sc-actions .btn-invalid { border-color: var(--st-invalid); color: var(--st-invalid); }
    .sc-actions .btn-invalid:hover { background: #fbeeee; }
    .sc-actions .btn-archive { border-color: var(--st-archived); color: var(--muted); }
    .sc-actions .btn-archive:hover { background: #f0f0f2; }
    .sc-noop { font-size: 11px; color: var(--muted); }

    /* 底部链接行 */
    .sc-foot {
      margin-top: 8px; padding-top: 7px;
      border-top: 1px dashed var(--line);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px;
    }
    .frag-toggle {
      border: none; background: none; padding: 0;
      color: var(--c-fragment); font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .frag-toggle:hover { color: var(--c-evidence); text-decoration: underline; }

    /* Fragment 展开区 */
    .sc-frags { margin-top: 8px; }
    .sc-frags .frag-loading { font-size: 12px; color: var(--muted); }
    .frag-row { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
    .frag-row:last-child { border-bottom: none; }
    .frag-row .fr-main { flex: 1 1 auto; min-width: 0; }
    .frag-row .fr-id { font-weight: 600; }
    .frag-row .fr-content { margin-top: 2px; overflow-wrap: anywhere; }
    .frag-row .fr-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

    /* 板块徽标行（G3） */
    .sc-domains { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0 1px; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="brand">BSP Reality Layer<small>Business Signal Protocol 1.1</small></div>
    <a class="nav-link nav-graph" href="/static/graph/graph.html"><span class="ico-badge">◆</span> Graph OS</a>
    <a class="nav-link" href="./index.html">总览</a>

    <a class="nav-link active" href="./signals.html">Signal 工作台</a>
    <a class="nav-link" href="./trace.html">追溯</a>

    <a class="nav-link" href="./domains.html">板块管理</a>
  </nav>

  <main class="page">
    <header class="page-head">
      <div class="page-title">Signal 工作台</div>
      <div class="page-sub">信号 = 从资料里提炼出的一条条事实。在这里核对它们：确认无误（已核）、有误（无效）、办结（归档）。全程只改状态，任何记录都不会被删除。</div>
    </header>

    <div id="error" class="error-box" hidden></div>

    <!-- 空库引导 -->
    <section id="empty-guide" class="card empty-guide" hidden>
      <div class="eg-icon">◆</div>
      <h2>还没有任何信号</h2>
      <p>信号是从资料里提炼出的一条条事实，必须有原文里的关键句做支撑、并挂到业务对象上。请先到录入台完成「原文 → 划句 → 提炼」三步。</p>
      <a class="btn primary" href="./intake.html">前往录入台</a>
    </section>

    <!-- 工具条 -->
    <section class="card" id="toolbar" hidden>
      <div class="tb-row">
        <label>类型<span class="exp-ico" data-exp-key="signal-type">?</span>
          <select id="type-filter">
            <option value="全部">全部</option>
            <option value="observation">观察</option>
            <option value="event">事件</option>
            <option value="change">变更</option>
            <option value="status">状态</option>
            <option value="action">行动</option>
          </select>
        </label>
        <label>板块<span class="exp-ico" data-exp-key="domain">?</span>
          <select id="domain-filter">
            <option value="全部">全部</option>
          </select>
        </label>
        <label>排序
          <select id="sort-mode">
            <option value="time">捕获时间 新→旧</option>
            <option value="conf-desc">置信度 高→低</option>
            <option value="conf-asc">置信度 低→高</option>
          </select>
        </label>
        <input id="kw" type="search" placeholder="搜索观察内容关键词…" />
        <span class="tb-count num" id="total-count"></span>
      </div>
    </section>

    <!-- 四列看板 -->
    <div class="board-wrap" id="board-wrap" hidden>
      <div class="board" id="board"></div>
    </div>
  </main>

  <script type="module" src="./signals.js"></script>
  <script type="module">
    import { injectExplainers } from './explain.js';
    injectExplainers();
  </script>
</body>
