<head>
  <meta charset="UTF-8" />

  <title>BSP Reality Layer — 证据库</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <nav class="nav">
    <div class="brand">BSP Reality Layer<small>Business Signal Protocol 1.1</small></div>
    <a class="nav-link nav-graph" href="/static/graph/graph.html">◆ Graph OS</a>
    <a class="nav-link" href="./index.html">总览</a>
    <a class="nav-link" href="./intake.html">录入台</a>
    <a class="nav-link active" href="./evidence.html">证据库</a>
    <a class="nav-link" href="./signals.html">Signal 工作台</a>
    <a class="nav-link" href="./trace.html">追溯</a>
    <a class="nav-link" href="./objects.html">对象全景</a>
    <a class="nav-link" href="./domains.html">板块管理</a>
  </nav>

  <main class="page">
    <header class="page-head">
      <div class="page-title">证据库 · Evidence</div>
      <div class="page-sub">所有原始资料的存档库。原文一旦录入就不可修改，每条都有防伪指纹（checksum）可随时验证没被动过。点左侧任意一条，查看原文和从中划出的关键句。</div>
    </header>

    <div id="error" class="error-box" hidden></div>

    <div class="split">
      <!-- 左栏：Evidence 列表 -->
      <div class="col-list">
        <div class="card">
          <h3><span>Evidence 列表<span class="exp-ico" data-exp-key="evidence">?</span> <span id="ev-count" class="num"></span></span></h3>
          <div id="ev-list"></div>
        </div>
      </div>

      <!-- 右栏：详情视图 -->
      <div class="col-detail">
        <div class="card" id="ev-detail">
          <h3>详情</h3>
          <p class="notice" id="detail-placeholder">从左侧选择一条资料，查看原文、划出的关键句和防伪指纹校验。</p>
          <div id="detail-body" hidden></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./evidence.js"></script>
  <script type="module">
    import { injectExplainers } from './explain.js';
    injectExplainers();
  </script>
</body>
