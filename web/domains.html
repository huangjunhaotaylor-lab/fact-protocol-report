<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSP Reality Layer — 板块管理</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* ===== 板块管理页自有样式（不动 styles.css） ===== */

    /* 工具条 */
    .dm-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .dm-toolbar .dm-note { font-size: 12px; color: var(--muted); }
    .dm-toolbar .btn { margin-left: auto; }

    /* 重新分类结果 */
    #reclassify-result { margin-top: 10px; font-size: 12px; }
    #reclassify-result .rc-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #reclassify-result .rc-dist { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    #reclassify-result .rc-item { display: inline-flex; align-items: center; gap: 4px; }

    /* 板块卡片 */
    #domain-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .dcard {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .dc-head { display: flex; align-items: center; gap: 8px; }
    .dc-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    .dc-name { font-size: 14px; font-weight: 600; }
    .dc-counts { font-size: 12px; color: var(--muted); }
    .dc-save { margin-left: auto; }
    .dc-state { font-size: 11px; color: var(--muted); margin-left: 6px; }
    .dc-state.dirty { color: #8a5a12; }
    .dc-state.saved { color: #276749; }

    /* 关键词 chips */
    .dc-kws { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
    .kw-chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; padding: 1px 6px 1px 9px;
      border: 1px solid var(--line-strong); border-radius: 10px;
      background: var(--bg); color: var(--ink);
    }
    .kw-x {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px;
      border: none; background: none; padding: 0; cursor: pointer;
      color: var(--muted); font-size: 12px; line-height: 1; font-family: inherit;
    }
    .kw-x:hover { color: #9b2c2c; }
    .kw-input {
      border: 1px dashed var(--line-strong); border-radius: 10px; background: var(--card-bg);
      padding: 2px 9px; font-size: 12px; font-family: inherit; color: var(--ink);
      width: 120px;
    }
    .kw-input:focus { outline: none; border-color: var(--accent); border-style: solid; }

    /* 未分类信号队列 */
    .uq-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 12px;
    }
    .uq-row:last-child { border-bottom: none; }
    .uq-id { font-weight: 600; }
    .uq-body { flex: 1 1 260px; min-width: 200px; overflow-wrap: anywhere; }
    .uq-doms { color: var(--muted); font-size: 11px; }
    .uq-row select[multiple] {
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 12px; color: var(--ink);
      background: var(--card-bg); padding: 3px; min-width: 130px;
    }
    .uq-row select[multiple]:focus { outline: none; border-color: var(--accent); }
    .uq-empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  </style>
</head>
<body>

    <div class="brand">BSP Reality Layer<small>Business Signal Protocol 1.1</small></div>

  </nav>

  <main class="page">
    <header class="page-head">
      <div class="page-title">板块管理 · Domains</div>
      <div class="page-sub">业务板块的分类规则中心：系统按关键词自动给信号分板块。这里可以调词、重新分类、处理没分清的信号。人工纠正过的永远优先，不会被自动分类覆盖。</div>
    </header>

    <div id="error" class="error-box" hidden></div>

    <!-- 工具条：重新分类 -->
    <section class="card">
      <h3><span>存量重新分类<span class="exp-ico" data-exp-key="reclassify">?</span></span></h3>
      <div class="dm-toolbar">
        <span class="dm-note">拿当前关键词把所有信号重新分一遍板块；人工手动改过的信号不会被覆盖。可重复执行，结果一样。</span>
        <button class="btn" id="btn-reclassify" data-tip="对全部未人工纠正的信号重跑板块分类器，并重算 Object 传导">重新分类</button>
      </div>
      <div id="reclassify-result" hidden></div>
    </section>

    <!-- 板块字典卡片 -->
    <section>
      <h3 style="margin:0 0 10px"><span>板块字典<span class="exp-ico" data-exp-key="domain-keywords">?</span> <span class="notice" style="text-transform:none;letter-spacing:0">（点 × 删词 · 输入框回车加词 · 保存后自动分类立即生效）</span></span></h3>
      <div id="domain-cards"><p class="notice">加载中…</p></div>
    </section>

    <!-- 未分类信号队列 -->
    <section class="card" id="unclassified-card" style="margin-top:14px">
      <h3><span>未分类信号队列<span class="exp-ico" data-exp-key="unclassified">?</span> <span id="unclassified-count" class="num"></span></span></h3>
      <div id="unclassified-list"><p class="notice">加载中…</p></div>
    </section>
  </main>
